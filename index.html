/* =====================================================
   SERVER REQUEST
===================================================== */

async function apiRequest(
    path,
    options = {}
){

    const response =
        await fetch(
            SERVER_URL + path,
            {
                ...options,

                headers:{
                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})
                }
            }
        );


    let data = null;


    try{

        data =
            await response.json();

    }
    catch{

        data = {
            success:false,
            error:"پاسخ سرور معتبر نیست."
        };

    }


    if(!response.ok){

        const error =
            new Error(
                data?.error ||
                "خطای سرور"
            );

        error.status =
            response.status;

        error.data =
            data;

        throw error;

    }


    return data;

}


/* =====================================================
   HEALTH CHECK
===================================================== */

async function checkServer(){

    const response =
        await fetch(
            SERVER_URL +
            "/api/health",
            {
                method:"GET"
            }
        );


    if(!response.ok){

        throw new Error(
            "سرور پاسخ مناسبی نداد."
        );

    }


    const data =
        await response.json();


    if(
        !data.success ||
        !data.database
    ){

        throw new Error(
            "اتصال D1 برقرار نیست."
        );

    }


    return data;

}

async function enterChat(){

    const name =
        nameInput.value.trim();


    if(!name){

        connectionStatus.textContent =
            "لطفاً ابتدا نام خود را وارد کنید.";

        connectionStatus.style.color =
            "#ff8197";

        return;

    }


    if(name.length < 2){

        connectionStatus.textContent =
            "نام باید حداقل ۲ حرف داشته باشد.";

        connectionStatus.style.color =
            "#ff8197";

        return;

    }


    currentUserName =
        name;


    if(!currentUserId){

        currentUserId =
            createUserId();

        localStorage.setItem(
            "chat_user_id",
            currentUserId
        );

    }


    localStorage.setItem(
        "chat_user_name",
        currentUserName
    );


    enterButton.disabled =
        true;


    connectionStatus.textContent =
        "در حال اتصال به Cloudflare...";

    connectionStatus.style.color =
        "#91a4bc";


    try{

        await checkServer();


        connectionStatus.textContent =
            "اتصال به سرور موفق بود...";

        connectionStatus.style.color =
            "#46d9a5";


        await loadRoomName();

        await registerOnline();

        await loadMessages();


        loginScreen.style.display =
            "none";

        chatApp.style.display =
            "flex";


        startPolling();

        startOnlineHeartbeat();


        messageInput.focus();


    }
    catch(error){

        console.error(error);


        connectionStatus.textContent =
            "اتصال به سرور برقرار نشد.";

        connectionStatus.style.color =
            "#ff8197";


        alert(
            "اتصال به سرور یا D1 برقرار نشد.\n\n" +
            (
                error.message ||
                "خطای نامشخص"
            )
        );

    }
    finally{

        enterButton.disabled =
            false;

    }

}

/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

    try{

        const data =
            await apiRequest(
                "/api/messages"
            );


        if(
            !data.success
        ){

            return;

        }


        const serverMessages =
            Array.isArray(
                data.messages
            )
            ?
            data.messages
            :
            [];


        /*
           پیام‌هایی که سرور حذف کرده
           از صفحه فعلی هم حذف شوند.
        */

        const serverIds =
            new Set(
                serverMessages.map(
                    message =>
                    String(
                        message.id
                    )
                )
            );


        document
            .querySelectorAll(
                ".message-row[data-message-id]"
            )
            .forEach(
                row => {

                    const id =
                        row.dataset.messageId;


                    if(
                        id ===
                        "welcome-message"
                    ){

                        return;

                    }


                    if(
                        !serverIds.has(id)
                    ){

                        row.remove();

                        knownMessageIds.delete(
                            id
                        );

                    }

                }
            );


        /*
           پیام‌های سرور را اضافه کن.
        */

        for(
            const serverMessage
            of serverMessages
        ){

            const normalized =
                normalizeServerMessage(
                    serverMessage
                );


            if(
                !normalized.messageId
            ){

                continue;

            }


            if(
                knownMessageIds.has(
                    normalized.messageId
                )
            ){

                continue;

            }


            renderServerMessage(
                normalized
            );

        }


        if(
            serverMessages.length
        ){

            knownMessageIds =
                new Set(
                    serverMessages.map(
                        m =>
                        String(
                            m.id
                        )
                    )
                );

        }


        scrollMessages(false);

    }
    catch(error){

        console.error(
            "LOAD MESSAGES ERROR",
            error
        );

    }

}


/* =====================================================
   NORMALIZE SERVER MESSAGE
===================================================== */

function normalizeServerMessage(
    message
){

    return {

        messageId:
            String(
                message.id
                ||
                ""
            ),

        senderId:
            String(
                message.sender_id
                ||
                ""
            ),

        senderName:
            message.sender_name
            ||
            "کاربر",

        type:
            message.type
            ||
            "text",

        text:
            message.text
            ||
            "",

        fileName:
            message.file_name
            ||
            "",

        fileSize:
            Number(
                message.file_size
                ||
                0
            ),

        mimeType:
            message.mime_type
            ||
            "",

        fileData:
            message.file_data
            ||
            null,

        createdAt:
            Number(
                message.created_at
                ||
                Date.now()
            ),

        /* # قاب پیام از سرور. اگر بک‌اند این ستون را نداشته باشد،
           مقدار همیشه "none" برمی‌گردد و پیام بدون قاب نمایش داده می‌شود. */
        frame:
            message.frame
            ||
            "none",

        /* # وضعیت (ایموجی) فرستنده، مخصوص همین پیام.
           نام ستون احتمالی در سرور را با توجه به بک‌اند واقعی
           خودتان تنظیم/اضافه کنید (مثلاً sender_status). */
        senderStatus:
            message.sender_status
            ||
            message.senderStatus
            ||
            "",

        replyTo:
            message.reply_to_id
            ?
            {

                messageId:
                    String(
                        message.reply_to_id
                    ),

                senderId:
                    message.reply_to_sender_id
                    ||
                    "",

                senderName:
                    message.reply_to_sender_name
                    ||
                    "",

                type:
                    message.reply_to_type
                    ||
                    "text",

                preview:
                    message.reply_to_preview
                    ||
                    ""

            }
            :
            null

    };

}


/* =====================================================
   # تبدیل پیام محلی (بلافاصله بعد از ارسال) به همان
   ساختاری که normalizeServerMessage تولید می‌کند، تا بتوان
   با renderServerMessage یکسان رندر کرد. این کار باعث می‌شود
   فرستنده، فریم و وضعیت پیامش را فوری ببیند، حتی اگر بک‌اند
   این فیلدها را ذخیره نکند.
===================================================== */

function normalizeLocalMessage(
    payload
){

    return {

        messageId: payload.messageId,

        senderId: payload.senderId,

        senderName: payload.senderName,

        type: payload.type,

        text: payload.text || "",

        fileName: payload.fileName || "",

        fileSize: payload.fileSize || 0,

        mimeType: payload.mimeType || "",

        fileData: payload.fileData || null,

        createdAt: Date.now(),

        frame: payload.frame || "none",

        senderStatus: payload.senderStatus || "",

        replyTo: payload.replyTo || null

    };

}


/* =====================================================
   RENDER SERVER MESSAGE
===================================================== */

function renderServerMessage(
    data
){

    if(
        knownMessageIds.has(
            data.messageId
        )
    ){

        return;

    }


    knownMessageIds.add(
        data.messageId
    );


    const mine =
        data.senderId ===
        currentUserId;


    const container =
        createMessageContainer(
            data,
            mine
        );


    if(
        data.type === "text"
    ){

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "message-text";

        /* # به‌جای textContent ساده، متن را از فیلتر ایموجی‌های
           خاص عبور می‌دهیم تا کدهایی مثل {{emoji:bard}} به
           تصویر واقعی تبدیل شوند (و در ضمن امن باقی بماند). */
        renderMessageTextContent(
            text,
            data.text
        );


        container.message.appendChild(
            text
        );

    }

    else{

        renderServerFile(
            container,
            data
        );

    }


    const time =
        document.createElement(
            "div"
        );

    time.className =
        "message-time";

    time.textContent =
        formatMessageTime(
            data.createdAt
        );


    container.message.appendChild(
        time
    );


    messages.appendChild(
        container.row
    );

}


/* =====================================================
   # امن‌سازی متن + جایگزینی کدهای ایموجی خاص با تصویر
===================================================== */

function escapeHtml(
    str
){

    return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

}


function renderMessageTextContent(
    containerEl,
    rawText
){

    const escaped =
        escapeHtml(rawText);


    /* الگوی {{emoji:id}} در متن پیدا و با تگ img جایگزین می‌شود */

    const withEmojis =
        escaped.replace(
            /\{\{emoji:([a-z0-9-]+)\}\}/g,
            function(match, id){

                const icon =
                    SPECIAL_EMOJI_MAP[id];


                if(!icon){

                    return match;

                }


                return (
                    '<img class="special-emoji-inline" src="' +
                    icon.url +
                    '" alt="' +
                    id +
                    '">'
                );

            }
        );


    containerEl.innerHTML =
        withEmojis;

}


/* =====================================================
   SERVER FILE
===================================================== */

function renderServerFile(
    container,
    data
){

    if(
        !data.fileData
    ){

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "message-text";

        text.textContent =
            "⚠️ اطلاعات فایل در سرور موجود نیست.";

        container.message.appendChild(
            text
        );

        return;

    }


    const url =
        makeDataUrl(
            data.fileData,
            data.mimeType
        );


    if(
        data.type === "image"
    ){

        addServerImage(
            container,
            data,
            url
        );

        return;

    }


    if(
        data.type === "video"
    ){

        addServerVideo(
            container,
            data,
            url
        );

        return;

    }


    if(
        data.type === "audio"
    ){

        addServerAudio(
            container,
            data,
            url
        );

        return;

    }


    addServerGenericFile(
        container,
        data,
        url
    );

}

/* =====================================================
   DATA URL
===================================================== */

function makeDataUrl(
    fileData,
    mimeType
){

    if(
        !fileData
    ){

        return "";

    }


    if(
        fileData.startsWith(
            "data:"
        )
    ){

        return fileData;

    }


    return (
        "data:"
        +
        (
            mimeType ||
            "application/octet-stream"
        )
        +
        ";base64,"
        +
        fileData
    );

}

/* =====================================================
   FILE TO BASE64
===================================================== */

function fileToBase64(
    file
){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(){

                    const result =
                        reader.result;


                    const base64 =
                        String(
                            result
                        ).split(
                            ","
                        )[1];


                    resolve(
                        base64
                    );

                };


            reader.onerror =
                function(){

                    reject(
                        new Error(
                            "خواندن فایل انجام نشد."
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}

            :

    row.dataset.senderId =
        data.senderId;

        document.createElement(
            "div"
        );

        "message";

       استایل واقعی هر فریم (نئونی آبی/صورتی، طلایی، ساده)
       در فایل style.css تعریف می‌شود. */

    const frameId =
        data.frame &&
        FRAME_OPTIONS.some(f => f.id === data.frame)
        ?
        data.frame

    senderRow.appendChild(
        sender
    );

            "div"
        );

        "message-menu";

        document.createElement(
            "button"
        );

        "message-action-button";

        "click",
        function(e){

            startReply(
                data
            );

            menu.classList.remove(
                "active"
            );

        }
    );


    menu.appendChild(
        replyButton
    );


    if(

    ){

        const deleteButton =
            document.createElement(
                "button"
            );

            "message-action-button delete-message-button";

            );

        }
    );


    message.appendChild(
        menuButton
    );

    message.appendChild(
        menu
    );


    row.appendChild(
        message
    );


    return {

        row,
        message

    };

}

        "reply-preview-name";

    name.textContent =
        "پاسخ به " +
        (
            reply.senderName ||
            "کاربر"
        );


    const text =
        document.createElement(
            "div"
        );

    text.className =
        "reply-preview-text";

    text.textContent =
        getReplyPreviewText(
            reply
        );


    box.appendChild(
        name
    );

    box.appendChild(
        text
    );


    box.addEventListener(
        "click",
        function(){

            scrollToMessage(
                reply.messageId
            );

        }
    );


    return box;

}


function getReplyPreviewText(
    data
){

    if(
        data.preview
    ){

        return data.preview;

    }


    switch(data.type){

        case "image":
            return "📷 عکس";

        case "video":
            return "🎬 ویدیو";

        case "audio":
            return "🎙️ ویس";

        case "file":
            return (
                "📄 " +
                (
                    data.fileName ||
                    "فایل"
                )
            );

        default:
            return "پیام متنی";

    }

}

===================================================== */

function scrollToMessage(
    messageId
){

    const row =
        document.querySelector(
            `[data-message-id="${CSS.escape(messageId)}"]`
        );


    if(!row){

        return;

    }


    row.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });


    const message =
        row.querySelector(
            ".message"
        );


    if(message){

        message.classList.remove(
            "highlight-message"
        );


        void message.offsetWidth;


        message.classList.add(
            "highlight-message"
        );

    }

}

){

                    data.messageId
                ),
                {

                    method:"DELETE",

                    body:
                        JSON.stringify({

                }
            );

        ){

function buildSpecialEmojiPanel(){

    emojiPanelTabs.innerHTML = "";

    SPECIAL_EMOJI_PACKS.forEach(

                document.createElement(

                "emoji-tab" +
                (index === 0 ? " active" : "");

            tab.textContent =

                "click",

                        .querySelectorAll(".emoji-tab")

function renderEmojiGrid(

){

    emojiPanelGrid.innerHTML = "";


    pack.icons.forEach(function(icon){

        item.className =
            "emoji-item";

        item.title =
            icon.id;


        const img =
            document.createElement(
                "img"
            );

        img.src = icon.url;

        img.alt = icon.id;


        item.appendChild(img);


        item.addEventListener(
            "click",
            function(e){

                e.stopPropagation();

                insertEmojiToken(
                    icon.id
                );

            }
        );


        emojiPanelGrid.appendChild(
            item
        );

    });

}


function insertEmojiToken(
    id
){

    const token =
        "{{emoji:" + id + "}}";


    const start =
        messageInput.selectionStart ??
        messageInput.value.length;

    const end =
        messageInput.selectionEnd ??
        messageInput.value.length;


    const before =
        messageInput.value.slice(0, start);

    const after =
        messageInput.value.slice(end);


    messageInput.value =
        before + token + after;


    const cursorPos =
        (before + token).length;

    messageInput.focus();

    messageInput.setSelectionRange(
        cursorPos,
        cursorPos
    );


    resizeTextarea();

    closeSpecialEmojiPanel();

}


function toggleSpecialEmojiPanel(){

    closeFramePanel();

/* =====================================================
   RECORD AUDIO
===================================================== */

recordButton.addEventListener(
    "click",
    toggleRecording
);


async function toggleRecording(){

    if(isRecording){

        stopRecording();

        return;

    }


    try{

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true
                });


        audioChunks = [];


        mediaRecorder =
            new MediaRecorder(
                stream
            );


        mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            async function(){

                const audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "audio/webm"
                        }
                    );


                stream
                    .getTracks()
                    .forEach(
                        track =>
                        track.stop()
                    );


                if(
                    audioBlob.size >
                    MAX_FILE_BYTES
                ){

                    alert(
                        "پیام صوتی بیش از حد مجاز شد."
                    );

                    return;

                }


                try{

                    sendButton.disabled =
                        true;

                    recordButton.disabled =
                        true;


                    const base64 =
                        await fileToBase64(
                            new File(
                                [audioBlob],
                                "پیام-صوتی.webm",
                                {
                                    type:
                                        audioBlob.type
                                }
                            )
                        );


                    const data = {

                        messageId:
                            createMessageId(),

                        senderId:
                            currentUserId,

                        senderName:
                            currentUserName,

                        type:
                            "audio",

                        fileName:
                            "پیام-صوتی.webm",

                        fileSize:
                            audioBlob.size,

                        mimeType:
                            audioBlob.type,

                        fileData:
                            base64,

                        /* # فریم و وضعیت روی پیام صوتی هم اعمال می‌شود */
                        frame:
                            selectedFrame,

                        senderStatus:
                            currentUserStatus,

                        replyTo:
                            currentReply

                    };


                    const result =
                        await apiRequest(
                            "/api/messages",
                            {

                                method:"POST",

                                body:
                                    JSON.stringify(
                                        data
                                    )

                            }
                        );


                    if(
                        result.success
                    ){

                        renderServerMessage(
                            normalizeLocalMessage(data)
                        );

                        cancelReplyMode();

                        resetFrameSelection();

                        await loadMessages();

                        scrollMessages();

                    }

                }
                catch(error){

                    console.error(error);

                    showServerError(
                        error
                    );

                }
                finally{

                    sendButton.disabled =
                        false;

                    recordButton.disabled =
                        false;

                }

            };


        mediaRecorder.start();

        isRecording =
            true;


        recordButton.classList.add(
            "recording"
        );

        recordButton.textContent =
            "⏹";

    }
    catch(error){

        console.error(error);

        alert(
            "دسترسی به میکروفون داده نشد."
        );

    }

}


function stopRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ){

        mediaRecorder.stop();

    }


    isRecording =
        false;


    recordButton.classList.remove(
        "recording"
    );

    recordButton.textContent =
        "🎙️";

}

/* =====================================================

===================================================== */

function getMessageType(
    file
){

    if(
        file.type.startsWith(
            "image/"
        )
    ){

        return "image";

    }


    if(
        file.type.startsWith(
            "video/"
        )
    ){

        return "video";

    }


    if(
        file.type.startsWith(
            "audio/"
        )
    ){

        return "audio";

    }


    return "file";

}


/* =====================================================
   FILE TYPE
===================================================== */

function getFileType(
    file
){

    if(
        file.type.startsWith(
            "image/"
        )
    ){

        return "تصویر";

    }


    if(
        file.type.startsWith(
            "video/"
        )
    ){

        return "ویدیو";

    }


    if(
        file.type.startsWith(
            "audio/"
        )
    ){

        return "فایل صوتی";

    }


    return "فایل";

}


/* =====================================================
   FILE SIZE
===================================================== */

function formatFileSize(
    bytes
){

    if(bytes < 1024){

        return bytes + " B";

    }


    if(
        bytes <
        1024 * 1024
    ){

        return (
            bytes / 1024
        ).toFixed(1)
        +
        " KB";

    }


    if(
        bytes <
        1024 * 1024 * 1024
    ){

        return (
            bytes /
            (1024 * 1024)
        ).toFixed(2)
        +
        " MB";

    }


    return (
        bytes /
        (1024 * 1024 * 1024)
    ).toFixed(2)
    +
    " GB";

}
